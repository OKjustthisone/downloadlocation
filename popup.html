<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LocationDL</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" class="icon-sprite" aria-hidden="true">
    <defs>
      <symbol id="i-folder" viewBox="0 0 24 24">
        <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"></path>
      </symbol>
      <symbol id="i-settings" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.13.37.4.7.76.92.3.18.64.28.99.28H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1Z"></path>
      </symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24">
        <path d="M21 12a9 9 0 1 1-2.64-6.36"></path><path d="M21 3v6h-6"></path>
      </symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 5v14"></path><path d="M15 5v14"></path></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z"></path></symbol>
      <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path>
      </symbol>
      <symbol id="i-info" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path>
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 13 4 4L19 7"></path></symbol>
    </defs>
  </svg>

  <div class="popup">
    <header class="popup-head">
      <div class="brand">
        <img src="icons/icon48.png" width="38" height="38" alt="">
        <div class="brand-text">
          <h1>LocationDL</h1>
          <p>下载位置路由</p>
        </div>
      </div>
      <label class="switch" title="开启或暂停自动路由">
        <input id="masterToggle" type="checkbox" role="switch" aria-label="自动路由总开关">
        <span class="switch-track"></span>
      </label>
    </header>

    <div id="pausedBanner" class="paused-banner" hidden>
      <span><svg class="icon" aria-hidden="true"><use href="#i-pause"></use></svg> 自动路由已暂停</span>
      <button id="resumeBtn" class="link-btn" type="button">恢复</button>
    </div>

    <section class="stats" aria-label="概览">
      <div class="stat">
        <span>启用规则</span>
        <strong id="statRules">0</strong>
      </div>
      <div class="stat">
        <span>今日路由</span>
        <strong id="statToday">0</strong>
      </div>
      <div class="stat">
        <span>累计路由</span>
        <strong id="statTotal">0</strong>
      </div>
    </section>

    <section class="recent" aria-labelledby="recentHeading">
      <div class="section-head">
        <h2 id="recentHeading">最近路由</h2>
        <button id="refreshBtn" class="icon-btn" type="button" title="刷新" aria-label="刷新最近路由">
          <svg class="icon" aria-hidden="true"><use href="#i-refresh"></use></svg>
        </button>
      </div>

      <div id="recentList" class="recent-list"></div>

      <div id="recentEmpty" class="empty" hidden>
        <div class="empty-icon"><svg class="icon" aria-hidden="true"><use href="#i-folder"></use></svg></div>
        <p>还没有路由记录</p>
        <small>开启规则后下载一个文件试试。</small>
      </div>
    </section>

    <footer class="popup-foot">
      <button id="openOptionsBtn" class="btn btn-primary" type="button">
        <svg class="icon" aria-hidden="true"><use href="#i-settings"></use></svg>
        打开设置
      </button>
      <button id="openHistoryBtn" class="btn btn-secondary" type="button">
        全部记录
        <svg class="icon" aria-hidden="true"><use href="#i-arrow-right"></use></svg>
      </button>
    </footer>

    <p class="popup-note">
      <svg class="icon" aria-hidden="true"><use href="#i-info"></use></svg>
      文件只会保存到系统“下载”目录的子文件夹。
    </p>

    <div id="toastHost" class="toast-host" aria-live="polite" aria-atomic="false"></div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
